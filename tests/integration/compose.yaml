# Live services for the integration tests. Ports and health checks mirror the ``services:`` block of
# ``.github/workflows/tests.yml``; start with ``just services-up`` and run ``just tests-integration``.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: probirka
      POSTGRES_PASSWORD: probirka
      POSTGRES_DB: probirka
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probirka"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-alpine
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # single-node KRaft; the image's default advertised listener is PLAINTEXT://localhost:9092
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
