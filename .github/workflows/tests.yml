---
name: 🧐 test

on:
  pull_request:
    branches: [ main ]

jobs:
  linters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        just-trigger:
          - "fmt-check"
          - "lint"
          - "ty"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11
      - run: uv sync --dev
      - run: just ${{ matrix.just-trigger }}

  tests:
    runs-on: ubuntu-latest
    # 3.15 is still a prerelease, so it reports without blocking the pull request
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        experimental: [ false ]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: just tests
      # the core must import without a single third-party package installed
      - run: uv run --isolated --no-project --with . python -c "import probirka; from probirka import *"
      - uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: tests.lcov
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: probirka
          POSTGRES_PASSWORD: probirka
          POSTGRES_DB: probirka
        ports: [ "5432:5432" ]
        options: --health-cmd "pg_isready -U probirka" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: [ "5672:5672" ]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: [ "27017:27017" ]
        options: --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        # single-node KRaft; the image's default advertised listener is PLAINTEXT://localhost:9092
        image: apache/kafka:3.9.0
        ports: [ "9092:9092" ]
        options: --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" --health-interval 5s --health-timeout 10s --health-retries 20
      nginx:
        image: nginx:1.27-alpine
        ports: [ "8080:80" ]
        options: --health-cmd "wget -qO- http://localhost/ > /dev/null" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11
      - run: uv sync --dev
      # service addresses default to localhost and the ports published above, see tests/integration/conftest.py
      - run: just tests-integration
