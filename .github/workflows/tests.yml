---
name: 🧐 test

on:
  pull_request:
    branches: [ main ]

jobs:
  linters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        just-trigger:
          - "fmt-check"
          - "lint"
          - "ty"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11
      - run: uv sync --dev
      - run: just ${{ matrix.just-trigger }}

  tests:
    runs-on: ubuntu-latest
    # 3.15 is still a prerelease, so it reports without blocking the pull request
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        experimental: [ false ]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: just tests
      # the core must import without a single third-party package installed
      - run: uv run --isolated --no-project --with . python -c "import probirka; from probirka import *"
      - uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: tests.lcov